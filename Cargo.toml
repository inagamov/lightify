[package]
name = "lightify"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
librespot = "0.8.0"
librespot-oauth = "0.8.0"
protobuf = "3.7"
ratatui = "0.30.2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[build-dependencies]
vergen = "=9.0.6"
