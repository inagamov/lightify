[package]
name = "lightify"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
form_urlencoded = "1.2.2"
futures = "0.3.34"
librespot = "0.8.0"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "native-tls"] }
open = "5"
protobuf = "3.7"
ratatui = { version = "0.30.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
souvlaki = "0.9.3"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[build-dependencies]
vergen = "=9.0.6"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = {
  version = "0.3.2", 
  default-features = false,
  features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSRunningApplication"] 
}
objc2-foundation = { 
  version = "0.3.2",
  default-features = false,
  features = ["std", "NSDate", "NSDictionary", "NSGeometry", "NSObjCRuntime", "NSString", "NSRunLoop", "NSValue", "objc2-core-foundation"] 
}
objc2-media-player = {
  version = "0.3.2",
  default-features = false,
  features = ["std", "MPRemoteCommandCenter", "MPRemoteCommand", "MPNowPlayingInfoCenter"] 
}
